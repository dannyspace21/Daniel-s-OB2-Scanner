# Opens a pull request when a library or GitHub Action has an update,
# including security fixes. Nothing merges without you approving it.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
