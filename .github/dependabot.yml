# Opens a pull request when a library or GitHub Action has an update,
# including security fixes. Nothing merges without you approving it.
# Major versions (like Android Gradle Plugin 8 -> 9) need code changes,
# so those are skipped here and done by hand.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
