name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:

# The build only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The signing key lives in GitHub secrets, never in the repository.
      # Settings > Secrets and variables > Actions:
      #   SIGNING_KEYSTORE_BASE64  the .keystore file, base64-encoded
      #   SIGNING_STORE_PASSWORD   its password
      #   SIGNING_KEY_ALIAS        optional, defaults to "daniels"
      #   SIGNING_KEY_PASSWORD     optional, defaults to the store password
      # Without them the APK is signed with a throwaway debug key.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. This APK can't update an app installed from a signed build."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      # Your phone only accepts an update signed with the same key as the installed app.
      # This fails the build if the APK was signed with anything else, so you never
      # download an APK that won't install over your current one.
      - name: Check the APK can update the installed app
        env:
          EXPECTED_SHA256: AF7E2965122C6000E2A9491A35C2A68E51367C4A26F0F664843FA8B79938C6B3
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 'certificate SHA-256 digest' | awk '{print toupper($NF)}')
          echo "APK signed with: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::This APK is NOT signed with your app's key, so it can't update the app on your phone. Add the SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD repository secrets (see README > Signing key)."
            exit 1
          fi
          echo "Signed with your key: installs as an update."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: DanielsCarMechanicScanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
